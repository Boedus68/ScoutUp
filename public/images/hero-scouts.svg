<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ec9e8"/>
      <stop offset="45%" stop-color="#c5dff0"/>
      <stop offset="100%" stop-color="#e8f2e9"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a9e78"/>
      <stop offset="100%" stop-color="#3f7a55"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6b4a"/>
      <stop offset="100%" stop-color="#1a4a32"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd0ea"/>
      <stop offset="100%" stop-color="#6aa9d0"/>
    </linearGradient>
    <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3d63"/>
      <stop offset="100%" stop-color="#1b2a4a"/>
    </linearGradient>
  </defs>

  <!-- sky + landscape -->
  <rect width="1600" height="1000" fill="url(#skyGrad)"/>
  <circle cx="1280" cy="160" r="70" fill="#f6e7b0" opacity="0.85"/>
  <path d="M0 420 C180 360 320 450 480 390 C640 330 760 430 940 380 C1120 330 1280 410 1600 360 L1600 620 L0 620 Z" fill="url(#hillFar)" opacity="0.7"/>
  <path d="M0 540 C220 500 380 580 560 530 C760 470 920 580 1140 520 C1320 470 1460 540 1600 510 L1600 1000 L0 1000 Z" fill="url(#hillNear)"/>
  <path d="M0 760 C200 730 360 800 560 760 C780 710 980 810 1200 760 C1380 720 1500 780 1600 750 L1600 1000 L0 1000 Z" fill="#143526"/>

  <!-- distant tents -->
  <path d="M1180 620 L1240 520 L1300 620 Z" fill="#f4efe3" stroke="#1b2a4a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1240 520 L1240 620" stroke="#1b2a4a" stroke-width="3"/>
  <path d="M1320 640 L1365 560 L1410 640 Z" fill="#f4efe3" stroke="#1b2a4a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1365 560 L1365 640" stroke="#1b2a4a" stroke-width="3"/>

  <!-- trees -->
  <g fill="#1a4a32">
    <path d="M180 700 L230 560 L280 700 Z"/><rect x="218" y="700" width="24" height="50" fill="#3a2a1a"/>
    <path d="M320 720 L360 600 L400 720 Z"/><rect x="348" y="720" width="22" height="44" fill="#3a2a1a"/>
    <path d="M1480 700 L1520 580 L1560 700 Z"/><rect x="1508" y="700" width="22" height="48" fill="#3a2a1a"/>
  </g>

  <!-- Scout 1 (left, standing) -->
  <g transform="translate(420,430)">
    <!-- head -->
    <circle cx="70" cy="58" r="34" fill="#e0b48a"/>
    <path d="M42 48 C50 28 90 28 98 48" fill="#3a2a1a"/>
    <!-- neckerchief (fazzolettone): green + gold, original unit colors -->
    <path d="M48 92 L70 128 L92 92 Z" fill="#2f6b4a"/>
    <path d="M56 92 L70 116 L84 92 Z" fill="#d4a017"/>
    <circle cx="70" cy="130" r="7" fill="#d4a017"/>
    <!-- shirt celeste -->
    <path d="M28 100 C20 150 18 220 30 270 L110 270 C122 220 120 150 112 100 Z" fill="url(#shirt)"/>
    <path d="M70 100 L70 250" stroke="#5a96b8" stroke-width="2" opacity="0.5"/>
    <!-- sleeves -->
    <path d="M28 110 L8 190 L28 198 Z" fill="#6aa9d0"/>
    <path d="M112 110 L132 190 L112 198 Z" fill="#6aa9d0"/>
    <!-- belt -->
    <rect x="30" y="248" width="80" height="12" rx="2" fill="#1b2a4a"/>
    <rect x="62" y="250" width="16" height="8" rx="1" fill="#d4a017"/>
    <!-- dark blue velvet shorts -->
    <path d="M30 260 L30 340 L68 340 L70 270 L72 340 L110 340 L110 260 Z" fill="url(#shorts)"/>
    <!-- legs + blue knee socks -->
    <path d="M40 340 L40 410 L58 410 L58 340 Z" fill="#e0b48a"/>
    <path d="M82 340 L82 410 L100 410 L100 340 Z" fill="#e0b48a"/>
    <path d="M40 372 L40 420 L58 420 L58 372 Z" fill="#3a5f8a"/>
    <path d="M82 372 L82 420 L100 420 L100 372 Z" fill="#3a5f8a"/>
    <!-- shoes -->
    <ellipse cx="49" cy="424" rx="16" ry="8" fill="#1b2a4a"/>
    <ellipse cx="91" cy="424" rx="16" ry="8" fill="#1b2a4a"/>
    <!-- arms -->
    <ellipse cx="0" cy="200" rx="12" ry="18" fill="#e0b48a"/>
    <ellipse cx="140" cy="200" rx="12" ry="18" fill="#e0b48a"/>
  </g>

  <!-- Scout 2 (center-right, walking) -->
  <g transform="translate(720,460)">
    <circle cx="60" cy="50" r="32" fill="#c9956c"/>
    <path d="M34 42 C42 24 78 24 86 42" fill="#2a1f14"/>
    <path d="M40 82 L60 116 L80 82 Z" fill="#2f6b4a"/>
    <path d="M48 82 L60 106 L72 82 Z" fill="#d4a017"/>
    <circle cx="60" cy="118" r="6" fill="#d4a017"/>
    <path d="M22 90 C16 140 14 200 24 245 L96 245 C106 200 104 140 98 90 Z" fill="url(#shirt)"/>
    <path d="M60 90 L60 230" stroke="#5a96b8" stroke-width="2" opacity="0.45"/>
    <path d="M22 100 L4 170 L22 178 Z" fill="#6aa9d0"/>
    <path d="M98 100 L116 170 L98 178 Z" fill="#6aa9d0"/>
    <rect x="24" y="225" width="72" height="11" rx="2" fill="#1b2a4a"/>
    <path d="M24 236 L24 310 L56 310 L58 250 L60 310 L96 310 L96 236 Z" fill="url(#shorts)"/>
    <path d="M32 310 L28 380 L46 382 L48 310 Z" fill="#c9956c"/>
    <path d="M72 310 L74 380 L92 378 L90 310 Z" fill="#c9956c"/>
    <path d="M28 345 L26 390 L46 392 L48 345 Z" fill="#3a5f8a"/>
    <path d="M74 345 L74 390 L92 388 L90 345 Z" fill="#3a5f8a"/>
    <ellipse cx="36" cy="394" rx="15" ry="7" fill="#1b2a4a"/>
    <ellipse cx="84" cy="392" rx="15" ry="7" fill="#1b2a4a"/>
    <ellipse cx="-4" cy="178" rx="11" ry="16" fill="#c9956c"/>
    <ellipse cx="124" cy="178" rx="11" ry="16" fill="#c9956c"/>
  </g>

  <!-- Scout 3 (far right, seated on log) -->
  <g transform="translate(1020,520)">
    <ellipse cx="70" cy="250" rx="90" ry="18" fill="#3a2a1a"/>
    <circle cx="70" cy="48" r="30" fill="#d8a878"/>
    <path d="M46 40 C54 24 86 24 94 40" fill="#4a3424"/>
    <path d="M50 78 L70 108 L90 78 Z" fill="#2f6b4a"/>
    <path d="M58 78 L70 98 L82 78 Z" fill="#d4a017"/>
    <circle cx="70" cy="110" r="6" fill="#d4a017"/>
    <path d="M34 86 C28 130 30 180 38 210 L102 210 C110 180 112 130 106 86 Z" fill="url(#shirt)"/>
    <rect x="38" y="198" width="64" height="10" rx="2" fill="#1b2a4a"/>
    <path d="M38 208 L38 248 L102 248 L102 208 Z" fill="url(#shorts)"/>
    <!-- seated legs with socks -->
    <path d="M40 248 L20 248 L10 300 L30 304 L48 260 Z" fill="#d8a878"/>
    <path d="M100 248 L120 248 L130 300 L110 304 L92 260 Z" fill="#d8a878"/>
    <path d="M10 278 L8 308 L30 310 L32 280 Z" fill="#3a5f8a"/>
    <path d="M130 278 L132 308 L110 310 L108 280 Z" fill="#3a5f8a"/>
    <ellipse cx="16" cy="312" rx="14" ry="7" fill="#1b2a4a"/>
    <ellipse cx="124" cy="312" rx="14" ry="7" fill="#1b2a4a"/>
  </g>

  <!-- soft vignette edge for atmosphere (not badges) -->
  <rect width="1600" height="1000" fill="url(#skyGrad)" opacity="0" />
</svg>
